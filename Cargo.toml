[package]
name = "realworld-rust-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
chrono = "0.4"
dotenv = "0.15"
bcrypt = "0.15"
jsonwebtoken = "9"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors"] }
sea-orm = { version = "1", features = ["sqlx-sqlite", "runtime-tokio-native-tls"] }
